<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}ShuleHub Control{% endblock %}</title>
<style>
:root{--p1:#8d74e0;--p2:#6a50c8;--ink:#2d2547;--muted:#857da0;--line:#e4dbf4;--bg:#efeaf9;--card:#fff;--ok:#1f6b3b;--bad:#a02b4a}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;padding:14px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
header b{font-size:1.1rem;margin-right:10px}header a{color:#fff;text-decoration:none;padding:6px 12px;border-radius:999px;opacity:.9}
header a.on,header a:hover{background:rgba(255,255,255,.22);opacity:1}header form{margin-left:auto}
main{max-width:1100px;margin:22px auto;padding:0 16px}
.card{background:var(--card);border-radius:18px;padding:18px 20px;margin-bottom:16px;box-shadow:0 6px 20px rgba(106,80,200,.12)}
h1{margin:0 0 12px}h2{margin:0 0 10px;font-size:1.1rem}h3{margin:14px 0 6px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.92rem}
th{color:var(--p2);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
input,textarea,select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:12px;font:inherit}
label{font-size:.82rem;color:var(--muted);display:block;margin:10px 0 4px}
button,.btn{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border:0;border-radius:999px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
button.s{background:#fff;color:var(--p2);border:1px solid var(--line)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.stat b{display:block;font-size:1.8rem}.stat span{color:var(--muted);font-size:.85rem}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:600;background:var(--line);color:var(--p2)}
.tag.ok{background:#e3f6ea;color:var(--ok)}.tag.bad{background:#fbdfe4;color:var(--bad)}.tag.warn{background:#fdf1c9;color:#7a5b00}
.flash{border-radius:12px;padding:10px 14px;margin-bottom:12px}.flash.success{background:#e3f6ea;color:var(--ok)}.flash.error{background:#fbdfe4;color:var(--bad)}
.muted{color:var(--muted)}.copy{font-family:monospace;background:#f6f2fd;border-radius:8px;padding:4px 8px;word-break:break-all}
.two{display:grid;gap:16px;grid-template-columns:1fr 1fr}@media(max-width:800px){.two{grid-template-columns:1fr}}
</style></head><body>
{% if session.admin %}<header><b>ShuleHub Control</b>
<a href="{{ url_for('home') }}" class="{{ 'on' if request.endpoint=='home' }}">Overview</a>
<a href="{{ url_for('links') }}" class="{{ 'on' if request.endpoint in ('links','link_detail') }}">Tracked links</a>
<a href="{{ url_for('schools') }}" class="{{ 'on' if request.endpoint in ('schools','school_detail') }}">Schools</a>
<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="s">Log out</button></form></header>{% endif %}
<main>{% for c,m in get_flashed_messages(with_categories=true) %}<div class="flash {{ c }}">{{ m }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
