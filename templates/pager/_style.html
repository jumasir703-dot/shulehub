{# Styles shared by the pager pages. #}
<style>
  input[type=time]{ width:100%; padding:8px 10px; border-radius:7px; border:1px solid var(--line); background:var(--paper);
    font-size:.92rem; color:var(--ink); font-family:inherit; }
  input[type=time]:focus{ outline:2px solid var(--green-500); outline-offset:1px; }
  .pg-kind{ display:inline-block; padding:2px 10px; border-radius:999px; font-size:.72rem; font-weight:700; letter-spacing:.02em; background:#e7efe9; color:var(--green-900); }
  .pg-kind.meeting{ background:#e3ecf7; color:#1f4a7a; }
  .pg-kind.event{ background:var(--gold-100); color:#6b4a07; }
  .pg-kind.urgent{ background:var(--danger-bg); color:var(--danger); }
  .pg-alert{ display:block; }
  .pg-alert + .pg-alert{ margin-top:14px; }
  .pg-alert.new{ border-left:4px solid var(--gold-500); }
  .pg-alert.urgent.new{ border-left-color:var(--danger); }
  .pg-alert h3{ margin:8px 0 4px; font-size:1.08rem; }
  .pg-meta{ color:var(--muted); font-size:.84rem; margin:2px 0; }
  .pg-when{ font-weight:600; color:var(--green-900); margin:4px 0; }
  .pg-body{ white-space:pre-wrap; margin:8px 0 0; }
  .pg-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .pg-table{ width:100%; border-collapse:collapse; font-size:.9rem; }
  .pg-table th, .pg-table td{ border-bottom:1px solid var(--line); padding:8px 8px; text-align:left; vertical-align:middle; }
  .pg-table th{ font-size:.78rem; color:var(--muted); font-weight:600; }
  .pg-wrap{ overflow-x:auto; }
  .pg-stats{ display:flex; gap:10px; flex-wrap:wrap; margin:12px 0 4px; }
  .pg-stat{ border:1px solid var(--line); border-radius:var(--radius); padding:8px 14px; background:var(--paper); min-width:110px; }
  .pg-stat strong{ display:block; font-size:1.3rem; color:var(--green-900); }
  .pg-stat span{ font-size:.78rem; color:var(--muted); }
  .pg-stat.bad strong{ color:var(--danger); }
  .pg-checks{ display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:6px; }
  .pg-checks label, .pg-people label{ display:inline-flex; align-items:center; gap:7px; font-size:.9rem; color:var(--ink); margin:0; }
  .pg-people{ max-height:240px; overflow-y:auto; border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-top:8px; background:var(--paper); display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:4px 14px; }
  .pg-people small{ color:var(--muted); }
  .pg-sms{ border:1px dashed var(--line); border-radius:8px; padding:10px 12px; background:var(--paper); white-space:pre-wrap; font-size:.88rem; min-height:44px; }
  .pg-note-warn{ border-left:4px solid var(--gold-500); }
  .pg-inline{ display:inline; margin:0; }
  textarea.pg-text{ width:100%; min-height:90px; }
</style>
